# Profile stats from the restored fixture database.
#
# The fixture currently contains one calendar month. Selecting that month still runs the native
# monthly query and verifies the selector-to-load path; the all-time view asserts that the initial
# native total query completed and rendered its result grid.
appId: ${APP_ID}
---
- tapOn:
    id: main-tab-profile
- extendedWaitUntil:
    visible:
      id: profile-stats-details
    timeout: 15000
- tapOn:
    id: profile-stats-details

- extendedWaitUntil:
    visible:
      id: profile-stats-section
    timeout: 30000
- assertVisible: 'All time'
- assertVisible: 'Distance'
- assertVisible: 'Rides'
- assertVisible: 'Ride time'
- assertVisible: 'Top speed'

- tapOn:
    id: profile-period-select
- tapOn:
    id: profile-period-select-option-2026-8
- assertVisible: 'August 2026'

- runFlow: ../fixture/_home.yaml
